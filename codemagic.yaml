workflows:
  ios-app-store:
    name: iOS App Store Build
    integrations:
      app_store_connect: Magic
    environment:
      xcode: latest
      ios_signing:
        certificates:
          - Magic
        provisioning_profiles:
          - "Ary Perfumes"
          - "Ary Perfumes OneSignal"
    scripts:
      - name: Configure Xcode signing
        script: |
          xcode-project use-profiles --project "Ary Perfumes.xcodeproj"
      - name: Debug and Resolve Packages
        script: |
          echo "--- LISTING SCHEMES CODEMAGIC SEES ---"
          xcodebuild -project "Ary Perfumes.xcodeproj" -list
          echo "--- DOWNLOADING ONESIGNAL DEPENDENCIES ---"
          xcodebuild -resolvePackageDependencies -project "Ary Perfumes.xcodeproj"
      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --project "Ary Perfumes.xcodeproj" \
            --scheme "Ary Perfumes"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
