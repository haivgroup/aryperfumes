workflows:
  ios-app-store:
    name: iOS App Store Build
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: Haiv-Group.aryperfumes  # <-- CHANGE THIS
    scripts:
      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --project "Ary Perfumes.xcodeproj" \
            --scheme "Ary Perfumes"  # <-- CHANGE IF YOUR SCHEME IS DIFFERENT
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
