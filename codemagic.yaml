workflows:
  ios-app-store:
    name: iOS App Store Build
    integrations:
      app_store_connect: Magic
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: Haiv-Group.aryperfumes
    scripts:
      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --project "Ary Perfumes.xcodeproj" \
            --scheme "Ary Perfumes"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
